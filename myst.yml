version: 1
project:
  title: "From Model to Message"
  subtitle: "Power BI Data Visualization and Analysis — A PL-300 Aligned Course"
  authors:
    - name: Professor Carlos Marquez
      affiliations:
        - Miami Dade College
  description: |
    A pedagogical guide to data visualization in Power BI, aligned to the
    Visualize-and-Analyze and Manage-and-Secure domains of the Microsoft
    PL-300 certification exam (skills measured as of January 15, 2026).
    Designed for community college students who have completed an introductory
    Power BI data preparation and modeling course, with a neurodivergent-friendly
    structure throughout.
  keywords:
    - Power BI
    - Data Visualization
    - PL-300
    - Microsoft Certification
    - Data Analytics
    - DAX
    - Business Intelligence
    - AdventureWorks
  license: CC-BY-4.0
  open_access: true
  github: https://github.com/c-marq/power-bi-data-viz-pl300
